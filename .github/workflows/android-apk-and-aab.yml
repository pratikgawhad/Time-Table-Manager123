name: Time Table Manager - APK and Signed AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK and AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # Install ONLY the SDK components you need — avoids the removed 'tools' package.
      # ubuntu-latest already ships with cmdline-tools + platform-tools, so we just
      # accept licenses and (optionally) install build-tools / platforms.
      - name: Set up Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Use a REAL Gradle version. Prefer the wrapper if present (see next step).
          gradle-version: "8.13"

      - name: Check required project files
        run: |
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f .env.example

      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/app/my-upload-key.jks"
          test -s "$GITHUB_WORKSPACE/app/my-upload-key.jks"

      - name: Build Debug APK and Signed Release AAB
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/app/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          test -n "$STORE_PASSWORD"
          test -n "$KEY_PASSWORD"
          test -n "$KEY_ALIAS"
          # Prefer the wrapper (reproducible). Fall back to `gradle` if no wrapper exists.
          if [ -x ./gradlew ]; then
            ./gradlew assembleDebug bundleRelease --no-daemon --stacktrace
          else
            gradle assembleDebug bundleRelease --no-daemon --stacktrace
          fi

      - name: Verify build outputs
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          test -f app/build/outputs/bundle/release/app-release.aab
          ls -lh app/build/outputs/apk/debug/
          ls -lh app/build/outputs/bundle/release/

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: time-table-manager-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Signed Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: time-table-manager-signed-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary keystore
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/app/my-upload-key.jks"
