name: Build Signed APK (For Mobile Testing) & Play Store AAB

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-android-apk-and-aab:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug & Signed Release APK (For Mobile Testing)
        run: gradle assembleDebug assembleRelease --no-daemon

      - name: Build Signed Release AAB (For Play Store)
        run: gradle bundleRelease --no-daemon

      - name: Upload Mobile Test APK (Install on Phone)
        uses: actions/upload-artifact@v4
        with:
          name: Mobile-Install-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk

      - name: Upload Signed Play Store AAB (.aab)
        uses: actions/upload-artifact@v4
        with:
          name: PlayStore-Release-AAB
          path: app/build/outputs/bundle/release/*.aab
